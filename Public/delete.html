<!-- To delete room data-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Room - Hotel Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-delete">

    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-icon">🏨</span>
            <span class="brand-title">Grand Horizon Hotel</span>
        </a>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li class="dropdown">
                <button class="dropdown-btn">
                    Room Services <span class="dropdown-arrow">▾</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a href="list.html" class="dropdown-item">📋 List All Rooms</a></li>
                    <li><a href="listOne.html" class="dropdown-item">🔍 Search Specific Room</a></li>
                    <li><a href="insert.html" class="dropdown-item">➕ Add New Room</a></li>
                    <li><a href="update.html" class="dropdown-item">✏️ Update Room Details</a></li>
                    <li><a href="delete.html" class="dropdown-item active">🗑️ Delete Room</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="glass-card">
            <h1 class="page-title">DELETE ROOM</h1>
            <p class="page-subtitle">Remove the room record from the hotel inventory</p>
            <hr class="divider">

            <div class="form-group">
                <label class="form-label" for="roomValue">Room ID / Room Number</label>
                <select id="roomValue" class="form-input">
                    <option value="">Loading rooms...</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn btn-danger btn-block" onclick="deleteRoom()">🗑️ Confirm Delete</button>
                <button class="btn btn-outline btn-block" onclick="location.href='index.html'">🏠 Home Page</button>
            </div>

            <p class="footer-text">Grand Horizon Hotel &bull; Departure & Auditing</p>
        </div>
    </main>

    <script>
    function loadRooms()
    {
        fetch("/rooms")
        .then(response=>{
            if(!response.ok)
                throw new Error("Unable to load rooms");
            return response.json();
        })
        .then(rooms=>{
            let roomSelect=document.getElementById("roomValue");
            roomSelect.innerHTML='<option value="">-- Select a room --</option>';
            rooms.forEach(room=>{
                let option=document.createElement("option");
                option.value=room.room_id;
                option.textContent=`${room.room_number} (ID: ${room.room_id})`;
                roomSelect.appendChild(option);
            });
            if(rooms.length===0)
                roomSelect.innerHTML='<option value="">No rooms available</option>';
        })
        .catch(error=>{
            document.getElementById("roomValue").innerHTML='<option value="">Unable to load rooms</option>';
            alert(error.message);
        });
    }

    function deleteRoom()
    {
        let roomValue=document.getElementById("roomValue").value;
        if(!roomValue) {
            alert("Please select a room to delete");
            return;
        }

        if(confirm("Are you sure you want to delete this room record?")==false)
            return;

        fetch("/rooms/"+roomValue+"?byId=true",{
            method:"DELETE"
        })
        .then(response=>{
            if(response.ok)
                return response.text();

            return response.text().then(message=>{
                throw new Error(message);
            });
        })
        .then(message=>{
            alert(message);
            location.href="index.html";
        })
        .catch(error=>{
            alert(error.message);
        });
    }

    loadRooms();
    </script>
</body>
</html>
